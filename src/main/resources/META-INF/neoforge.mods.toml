modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT (port code); WTFPL (original Thaumic Concilium and Forbidden Magic material) - see CREDITS"
issueTrackerURL = "https://github.com/k1ngofpentacles/thaumic-concilium/issues"

[[mods]]
modId = "thaumicconcilium"
version = "${file.jarVersion}"
displayName = "Thaumic Concilium (Thaumaturge port)"
displayURL = "https://github.com/k1ngofpentacles/thaumic-concilium"
logoFile = "conc_logo.png"
# Adds the THAUMICCONCILIUM_MILL_CRANK arm pose (Shard Mill grinding, client only).
enumExtensions = "META-INF/enumextensions.json"
authors = "k1ngofpentacles; original by Ilya3000 and BreadX22"
credits = "Port of Ilya3000's Thaumic Concilium (WTFPL). Sin aspects from SpitefulFox's Forbidden Magic (WTFPL). Built for Thaumaturge by Leclowndu93150 and contributors; not affiliated with or endorsed by any of them."
description = '''
How thaumaturgy shapes a society: rival and maddened thaumaturges, the Crimson Cult's lost Pontifex,
flux rifts and subspace, flesh alchemy, and thirteen foci rebuilt as Thaumaturge spell parts.
'''

[[dependencies.thaumicconcilium]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.thaumicconcilium]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies.thaumicconcilium]]
modId = "thaumaturge"
type = "required"
versionRange = "[1.1,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.thaumicconcilium]]
modId = "curios"
type = "required"
versionRange = "[9.5,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.thaumicconcilium]]
modId = "thaumadditions"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# The original Concilium required Thaumic Tinkerer; its 1.21.1 counterpart is Thaumaturge Tinker (kajitsy, MIT).
[[dependencies.thaumicconcilium]]
modId = "thaumaturgetinker"
type = "required"
versionRange = "[1.1.3,)"
ordering = "AFTER"
side = "BOTH"

# The original Concilium required Forbidden Magic; here that is Forbidden Magic (Thaumaturge), which provides the sin
# aspects, the deadly shards and the crystalwell.
[[dependencies.thaumicconcilium]]
modId = "forbiddenmagic"
type = "required"
versionRange = "[2.0,)"
ordering = "AFTER"
side = "BOTH"

# Phase 8: the Assistant seal jars creatures into Thaumic Horizons' critter jar; the Golem Bydlo is made in its vat.
[[dependencies.thaumicconcilium]]
modId = "thaumichorizons"
type = "required"
versionRange = "[0.2,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.thaumicconcilium]]
    modId="botania"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

# Heartstone: a Verdant Capital's placer and their bound partner both take part in the rite.
[[dependencies.thaumicconcilium]]
    modId="dynamictrees"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

[[dependencies.thaumicconcilium]]
    modId="heartstone"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

# Crimson Dagger: the self-cut gives LP to a Neo Vitae altar; its hits use Enchanted's sacrifice damage type.
[[dependencies.thaumicconcilium]]
    modId="neovitae"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

[[dependencies.thaumicconcilium]]
    modId="enchanted"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"

# Accessor for the private aspect list of Thaumaturge crucibles (Quicksilver Reactor).
[[mixins]]
config = "thaumicconcilium.mixins.json"

# Cycle 4e: the grove growth boost for Dynamic Trees and vanilla saplings (optional: skipped if the targets are missing).
[[mixins]]
config = "thaumicconcilium.growth.mixins.json"
